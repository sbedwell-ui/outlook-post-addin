<!doctype html><html><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>POST Meeting Framework</title><script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script><script defer="defer" src="taskpane.js"></script></head><body><div id="app"><header class="header"><h1>POST Framework</h1><p class="subtitle">Meeting Best Practices</p></header><section class="section"><h2 class="section-title">Meeting Info</h2><div class="info-row"><span class="info-label">Attendees:</span><fluent-badge id="attendee-badge" appearance="filled"><span id="attendee-count">Loading...</span></fluent-badge></div><div class="info-row"><span class="info-label">Duration:</span> <span id="duration-text">Loading...</span></div><div class="button-row hidden" id="duration-buttons"><fluent-button id="btn-30min" appearance="outline" size="small">Make 30 min</fluent-button><fluent-button id="btn-45min" appearance="outline" size="small">Make 45 min</fluent-button></div></section><section class="section"><h2 class="section-title">POST Details</h2><div class="form-group"><label for="purpose-field">🎯 <strong>P</strong>urpose <span class="hint">Why are we meeting? (1 sentence)</span></label><fluent-text-field id="purpose-field" placeholder="e.g., Decide on Q1 marketing budget allocation"></fluent-text-field></div><div class="form-group"><label for="outcomes-field">✅ <strong>O</strong>utcomes <span class="hint">What will we achieve? (bullet points with owners)</span></label><fluent-text-area id="outcomes-field" placeholder="e.g.,&#10;- Approved budget breakdown - Finance Lead&#10;- Channel priorities agreed - Marketing Director" rows="4" resize="vertical"></fluent-text-area></div><div class="form-group"><label for="structure-field">🗂 <strong>S</strong>tructure <span class="hint">What topics/agenda items? (with timeboxes)</span></label><fluent-text-area id="structure-field" placeholder="e.g.,&#10;1. Review last quarter results - 10 min&#10;2. Present budget proposals - 15 min&#10;3. Discussion and decision - 10 min" rows="4" resize="vertical"></fluent-text-area></div><div class="form-group"><label for="timing-field">⏰ <strong>T</strong>iming <span class="hint">From meeting invite (updates automatically)</span></label><fluent-text-field id="timing-field" readonly="readonly" placeholder="Loading..."></fluent-text-field></div></section><section class="section actions"><fluent-button id="btn-save" appearance="accent">Save</fluent-button></section><div id="status-message" class="status hidden"></div></div></body></html>
